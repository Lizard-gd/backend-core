server:
  port: 8081

gg:
  jte:
    templateLocation: src/main/resources/jte/
    developmentMode: true

spring:
  application:
    name: mentee-power-crm
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      indent-output: true
    deserialization:
      fail-on-unknown-properties: false

logging:
  level:
    org.springframework.web: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

# Внешние API
email:
  validation:
    base-url: ${EMAIL_VALIDATION_URL:http://localhost:8089}