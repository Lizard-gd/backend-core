server:
  port: 8081

gg:
  jte:
    templateLocation: src/main/resources/jte/
    developmentMode: true

spring:
  application:
    name: mentee-power-crm
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

logging:
  level:
    org.springframework.web: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE